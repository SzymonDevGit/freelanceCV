<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<style>
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/space-grotesk-600.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/inter-tight-400.woff2) format('woff2')}
@font-face{font-family:'Space Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/space-mono-400.woff2) format('woff2')}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;
  background:#14100c;color:#c4b6a5;
  font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:16.5px;line-height:1.68}
main{max-width:560px}
.code{font-family:'Space Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.09em;
  text-transform:uppercase;color:#cd9c60;margin-bottom:26px}
h1{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;font-weight:600;
  font-size:clamp(30px,6vw,46px);line-height:1.08;letter-spacing:-.035em;color:#f0e7da;margin:0 0 18px}
p{margin:0 0 30px;color:#9b8b79}
.btns{display:flex;gap:12px;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;padding:14px 26px;border-radius:5px;
  font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;font-size:15px;font-weight:500;
  text-decoration:none;border:1px solid transparent;transition:transform .25s,background .25s,border-color .25s}
.solid{background:#cd9c60;color:#16110c;border-color:#cd9c60;box-shadow:0 3px 0 #8a5a30}
.solid:hover{background:#e7c495;transform:translateY(-2px)}
.line{border-color:#473a2c;color:#f0e7da;background:#1f1912}
.line:hover{border-color:#cd9c60;color:#cd9c60;transform:translateY(-2px)}
:focus-visible{outline:2px solid #cd9c60;outline-offset:3px;border-radius:3px}
hr{border:0;border-top:1px solid #332a20;margin:38px 0 20px}
.small{font-size:13.5px;color:#7d6e5e;margin:0}
.small a{color:#cd9c60}
</style>
</head>
<body>
<main>
  <div class="code">Error 404</div>
  <h1>That page isn't here.</h1>
  <p>The link is either out of date or slightly wrong. Everything lives on one page, so the homepage will have what you were after.</p>
  <div class="btns">
    <a class="btn solid" href="/">Back to the homepage</a>
    <a class="btn line" href="/#contact">Get in touch</a>
  </div>
  <hr>
  <p class="small">Szymon Pecherski — data analyst &amp; BI specialist, Cheltenham.
    <a href="mailto:szymonpecherski@gmail.com">szymonpecherski@gmail.com</a></p>
</main>
