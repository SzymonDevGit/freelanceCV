name: SEO gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit HTML, schema, sitemap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No dependencies: seo_audit.py is standard library only.
      - name: Run SEO audit
        run: python tools/seo_audit.py --strict

  live:
    name: Verify live site and ping IndexNow
    needs: audit
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Cloudflare needs a moment to publish after the push.
      - name: Wait for the deploy to land
        id: wait
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://szymonpecherski.online/sitemap.xml || true)
            if [ "$code" = "200" ]; then
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              echo "sitemap live after ${i} attempt(s)"
              exit 0
            fi
            sleep 15
          done
          echo "deployed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::sitemap.xml is not live yet — is Cloudflare Pages connected to this repo?"

      # Checks production server config: http->https redirect, www handling,
      # Content-Type charset, key URLs, real 404s.
      #
      # continue-on-error until the two Cloudflare dashboard settings are done
      # (Always Use HTTPS, and the www CNAME + redirect). Remove it afterwards
      # so a regression genuinely fails the build. See SEO.md.
      - name: Verify live server configuration
        if: steps.wait.outputs.deployed == 'true'
        continue-on-error: true
        run: python tools/seo_audit.py --live

      - name: Submit to IndexNow
        if: steps.wait.outputs.deployed == 'true'
        run: python tools/indexnow.py
